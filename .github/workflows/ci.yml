name: CI-MLflow-Project

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # bisa dijalankan manual dari tab Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout kode dari repo
      - uses: actions/checkout@v3

      # 2. Setup Python versi yang dibutuhkan
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12.7'

      # 3. Install dependencies (mlflow, pandas, scikit-learn)
      - name: Install dependencies
        run: pip install mlflow==2.19.0 pandas scikit-learn

      # 4. Jalankan MLproject (Ditambahkan --env-manager=local)
      - name: Run MLflow Project
        run: |
          TARGET_DIR=$(find . -type d -name "MLproject" | head -n 1)
          echo "MLproject ditemukan di: $TARGET_DIR"
          cd "$TARGET_DIR"
          mlflow run . --experiment-name CI_Experiment --env-manager=local

      # 5. Upload artifact (model) agar bisa diunduh atau digunakan nanti
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-model
          path: "**/mlruns/"

      # 6. Build Docker image dari model yang baru dilatih
      - name: Build Docker Image
        run: |
          # Cari folder mlruns yang dihasilkan secara dinamis di server
          MLRUNS_DIR=$(find . -type d -name "mlruns" | head -n 1)
          echo "Folder mlruns ditemukan di: $MLRUNS_DIR"
          
          # AMAN & AKURAT: Cari direktori di dalam mlruns/0/, abaikan file meta.yaml, dan ambil yang paling atas
          run_id=$(find $MLRUNS_DIR/0/ -maxdepth 1 -type d ! -path $MLRUNS_DIR/0/ -exec basename {} \;)
          echo "Run ID asli yang didapat: $run_id"
          
          # Jalankan perintah build docker menggunakan lokasi model yang tepat
          mlflow models build-docker -m "$MLRUNS_DIR/0/$run_id/model" -n "my-financial-model" --enable-mlserver

      # 7. Push Docker image ke Docker Hub
      - name: Push to Docker Hub
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          docker tag my-financial-model $DOCKER_USER/my-financial-model:latest
          echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin
          docker push $DOCKER_USER/my-financial-model:latest